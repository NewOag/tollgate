[workspace]
members = ["app/src-tauri"]

[package]
name = "tollgate"
version = "0.1.5"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
axum = "0.8.9"
axum-server = { version = "0.8", features = ["tls-rustls"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
futures-util = "0.3.33"
humantime = "2.4.0"
mdns-sd = "0.21"
rand = "0.8.5"
rcgen = { version = "0.14", default-features = false, features = ["pem", "crypto", "aws_lc_rs"] }
reqwest = { version = "0.13.4", features = ["stream", "json"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x509-parser = "0.18"
